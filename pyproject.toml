[build-system]
build-backend = "setuptools.build_meta"
requires = ["babel>2.8", "setuptools>=83", "wheel"]

[project]
name = "invenio-record-importer-kcworks"
version = "0.4.0"
description = "Bulk import records into a InvenioRDM instance configured for Knowledge Commons Works"
readme = "README.md"
keywords = [
  "bulk-import",
  "invenio",
  "invenio-rdm",
  "knowledge-commons-works",
  "record-importer",
]
license = "MIT"
authors = [{ name = "Mesh Research", email = "scottia4@msu.edu" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click",
  "halo",
  "invenio-app-rdm[opensearch2]<14",
  "invenio-communities",
  "invenio-group-collections-kcworks",
  "invenio-rdm-records",
  "invenio-records-resources",
  "invenio-remote-user-data-kcworks",
  "invenio-stats-dashboard",
  "invenio-utilities-tuw",
  "isbnlib",
  "jsonlines",
  "kcworks",
  "langdetect",
  "pydantic",
  "python-dateutil",
  "python-iso639",
  "python-stdnum",
  "pytz",
  "requests>=2.33",
  "timefhuman",
  "titlecase",
  "unidecode",
  "validators",
]
optional-dependencies.dev = [
  "bump-my-version==1.5.1",
  "check-manifest",
  "ipykernel",
]
optional-dependencies.test = [
  "coverage",
  "pytest>=8.4.2",
  "pytest-cov>=6.2.1",
  "pytest-invenio>=3.3,<4",
  "pytest-isort>=4",
  "pytest-mock",
  "pytest-ruff>=0.1",
  "requests-mock",
  "ruff>=0.3",
  "selenium>=4",
  "ty",
  "wheel>=0.46.2",
]
urls.Homepage = "https://github.com/Knowledge-Commons-Works/invenio-record-importer-kcworks"
scripts.importer = "invenio_record_importer_kcworks.cli:cli"
entry-points."flask.commands".importer = "invenio_record_importer_kcworks.cli:cli"
entry-points."invenio_base.api_apps".invenio_record_importer_kcworks = "invenio_record_importer_kcworks.ext:InvenioRecordImporter"
entry-points."invenio_base.api_blueprints".invenio_record_importer_kcworks = "invenio_record_importer_kcworks.resources:create_api_blueprint"
entry-points."invenio_base.apps".invenio_record_importer_kcworks = "invenio_record_importer_kcworks.ext:InvenioRecordImporter"
entry-points."invenio_celery.tasks".invenio-record-importer-kcworks = "invenio_record_importer_kcworks.tasks"
entry-points."invenio_oauth2server.scopes".records_import = "invenio_record_importer_kcworks.scopes:records_import_scope"

[tool.uv]
sources.invenio-communities = { path = "../invenio-communities", editable = true }
sources.invenio-group-collections-kcworks = { path = "../invenio-group-collections-kcworks", editable = true }
sources.invenio-rdm-records = { path = "../invenio-rdm-records", editable = true }
sources.invenio-remote-user-data-kcworks = { path = "../invenio-remote-user-data-kcworks", editable = true }
sources.invenio-stats-dashboard = { path = "../invenio-stats-dashboard", editable = true }
# kcworks is not overridden here: the root workspace (knowledge-commons-works or kcworks-next)
# provides it via its [tool.uv.sources], so both clones resolve to the current repo.
# CI script will modify other entries as needed (e.g. GitHub source).
sources.kcworks = { path = "../../../..", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  "**/*.ipynb",                                        # Exclude Jupyter notebook files
  "invenio_record_importer_kcworks/deprecated/**",     # Exclude deprecated files
  "invenio_record_importer_kcworks/libs/fedoraapi.py",
]
lint.select = ["B", "D", "DOC", "E", "F", "I", "UP"]
lint.ignore = [
  "D412", # Missing blank line before closing docstring
  "W1",   # Indentation warnings
  "W2",   # Whitespace warnings
  "W3",   # Blank line warnings
]
lint.per-file-ignores."__init__.py" = ["D104", "E402", "F401"]
# Multilingual lookup tables intentionally repeat spellings across locales.
lint.per-file-ignores."invenio_record_importer_kcworks/utils/monthwords.py" = [
  "E501",
  "F601",
]
lint.per-file-ignores."invenio_record_importer_kcworks/utils/seasonwords.py" = [
  "E501",
  "F601",
]
lint.isort.known-first-party = [
  "invenio_stats_dashboard",
  "invenio_group_collections_kcworks",
  "tests",
]
lint.pydocstyle.convention = "google"
lint.preview = true

[tool.isort]
profile = "black"
line_length = 88
verbose = true
multi_line_output = 3 # Vertical hanging indent
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
split_on_trailing_comma = true
skip = [
  "__pycache__", # Skip cache directories
  # ".venv",  # Skip virtual environment
  # "node_modules",  # Skip node modules
]

[tool.check-manifest]
ignore = [
  "PKG-INFO",
  ".egg-info",
  ".egg-info/*",
  "setup.cfg",
  ".DS_Store",
  ".hgtags",
  ".hgsigs",
  ".hgignore",
  ".gitignore",
  ".bzrignore",
  ".gitattributes",
  ".gitmodules",
  ".github/*",
  "* .mo",
  "dist/*",
  "build/*",
  ".venv/*",
  "*.pyc",
  "__pycache__/*",
  # Ignore submodule directories so check-manifest doesn't require their contents
  "invenio_record_importer_kcworks/dependencies",
  "invenio_record_importer_kcworks/dependencies/*",
  "invenio_record_importer_kcworks/dependencies/*/*",
  "invenio_record_importer_kcworks/dependencies/*/*/*",
  ".vscode/*",
]

[tool.ty]
analysis = {}
# Type checking with ty (replaces mypy). Mirrors the parent KCWorks
# project's [tool.ty] settings; paths adapted to this submodule's layout.
environment.python-version = "3.12"
rules.redundant-cast = "warn"
rules.unused-ignore-comment = "ignore"
rules.unused-type-ignore-comment = "ignore"
rules.unresolved-import = "ignore"
rules.unresolved-global = "ignore"
# Don't type-check tests or deprecated legacy code (same as former mypy exclude).
src.exclude = [
  "tests",
  "invenio_record_importer_kcworks/deprecated",
  # Legacy Fedora client; depends on removed swamplr write_to_log.
  "invenio_record_importer_kcworks/libs/fedoraapi.py",
]

[tool.pytest]
ini_options.addopts = """
--ruff --doctest-modules
--log-cli-level=DEBUG
--ignore=app_data
--ignore=docs
--ignore=node_modules
--ignore=scripts
--ignore=tests/helpers
--ignore=invenio_record_importer_kcworks/deprecated
--cov=invenio_record_importer_kcworks
--cov-report=term-missing
"""
ini_options.isort_show_files = true
ini_options.log_cli_level = "DEBUG"
ini_options.norecursedirs = []
ini_options.plugins = [
  "tests.fixtures.communities",
  "tests.fixtures.metadata_fields",
  "tests.fixtures.custom_fields",
  "tests.fixtures.identifiers",
  "tests.fixtures.records",
  "tests.fixtures.saml",
  "tests.fixtures.stats",
  "tests.fixtures.users",
  "tests.fixtures.vocabularies.affiliations",
  "tests.fixtures.vocabularies.community_types",
  "tests.fixtures.vocabularies.date_types",
  "tests.fixtures.vocabularies.descriptions",
  "tests.fixtures.vocabularies.languages",
  "tests.fixtures.vocabularies.licenses",
  "tests.fixtures.vocabularies.resource_types",
  "tests.fixtures.vocabularies.roles",
  "tests.fixtures.vocabularies.subjects",
]
ini_options.testpaths = ["tests", "invenio_record_importer_kcworks"]

[tool.coverage]
run.omit = []

[tool.bumpversion]
current_version = "0.4.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
commit = false
tag = false
allow_shell_hooks = false
message = "Bump version: {current_version} → {new_version}"

# pyproject.toml project.version and tool.bumpversion.current_version are
# updated automatically by bump-my-version's update_config_file; listing them
# here double-applies a whole-file search and fails on the second entry.
[[tool.bumpversion.files]]
filename = "README.md"
search = "Version {current_version}"
replace = "Version {new_version}"

[[tool.bumpversion.files]]
filename = "VERSION"
search = '"{current_version}"'
replace = '"{new_version}"'

[[tool.bumpversion.files]]
filename = "invenio_record_importer_kcworks/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

[tool.babel]
compile_catalog.directory = "translations/"
compile_catalog.use-fuzzy = true
extract_messages.copyright_holder = "Mesh Research"
extract_messages.msgid_bugs_address = "scottia4@msu.edu"
extract_messages.mapping-file = "translations/babel.ini"
extract_messages.output-file = "translations/messages.pot"
extract_messages.add-comments = "NOTE"
init_catalog.input-file = "translations/messages.pot"
init_catalog.output-dir = "translations/"
update_catalog.input-file = "translations/messages.pot"
update_catalog.output-dir = "translations/"

[tool.pylsp]
plugins.jedi.extra_paths = [
  "../../..",                             # kcworks (site/)
  "../invenio-communities",
  "../invenio-group-collections-kcworks",
  "../invenio-rdm-records",
  "../invenio-remote-user-data-kcworks",
  "../invenio-stats-dashboard",
]
